# Render blueprint — MCP Vouch trust-scoring worker.
# https://render.com/docs/blueprint-spec
#
# Single cron service that scores every active MCP Registry server every 6
# hours and upserts the report into Supabase `trust_scores`. Web hosting for
# mcpvouch.com is on Cloudflare Pages (or wherever the landing eventually
# lives) — this file only describes the worker.
#
# Apply: connect this repo in the Render dashboard. Render reads render.yaml
# from the repo root and provisions the listed services.

services:
  # -------------------------------------------------------------------------
  # mcp-vouch-worker — trust scoring (every 6 hours).
  #
  # Sandbox boundary: install-resolver only accepts servers whose source_url
  # resolves to an npm package; they're launched via `npx -y <pkg>`. Anything
  # else is logged + skipped (never executed).
  #
  # Concurrency + per-scan timeout are envInt-tunable from the Render
  # dashboard without a redeploy.
  # -------------------------------------------------------------------------
  - type: cron
    name: mcp-vouch-worker
    runtime: node
    plan: starter
    region: oregon
    schedule: "0 */6 * * *"  # every 6 hours, on the hour, UTC
    buildCommand: |
      npm ci
      npm run build
    startCommand: |
      node dist/worker/index.js
    envVars:
      - key: SUPABASE_URL
        sync: false                       # set in Render dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                       # set in Render dashboard — never commit
      # OOM root cause (2026-06-03 verification): orphan-child dispose fix
      # shipped (4d34fc9) but didn't solve OOM. Both post-fix runs (12:00 +
      # 18:00 UTC 6/3) still OOM'd at ~server #23, identical signature.
      # Real culprit: concurrent `npx -y <pkg>` installs of native-binary
      # packages (node-gyp / prebuild-install) blow 512Mi regardless of
      # orphan cleanup. Drop to serial. If 1 still OOMs the parent worker
      # alone is over budget → upgrade Render plan starter → standard 2Gi.
      - key: MCP_VOUCH_CONCURRENCY
        value: "1"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      - key: MCP_VOUCH_SCAN_TIMEOUT_MS
        value: "60000"
      - key: MCP_VOUCH_MAX_PER_RUN
        value: "200"
      - key: NODE_VERSION
        value: "22.14.0"
