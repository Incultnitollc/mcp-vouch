# Render blueprint — MCP Vouch trust-scoring worker.
# https://render.com/docs/blueprint-spec
#
# Single cron service that scores every active MCP Registry server every 6
# hours and upserts the report into Supabase `trust_scores`. Web hosting for
# mcpvouch.com is on Cloudflare Pages (or wherever the landing eventually
# lives) — this file only describes the worker.
#
# Apply: connect this repo in the Render dashboard. Render reads render.yaml
# from the repo root and provisions the listed services.

services:
  # -------------------------------------------------------------------------
  # mcp-vouch-worker — trust scoring (every 6 hours).
  #
  # Sandbox boundary: install-resolver only accepts servers whose source_url
  # resolves to an npm package; they're launched via `npx -y <pkg>`. Anything
  # else is logged + skipped (never executed).
  #
  # Concurrency + per-scan timeout are envInt-tunable from the Render
  # dashboard without a redeploy.
  # -------------------------------------------------------------------------
  - type: cron
    name: mcp-vouch-worker
    runtime: node
    plan: starter
    region: oregon
    schedule: "*/5 * * * *"  # TEMP 2026-06-12: every 5min to capture diagnostic logs — REVERT to "0 */6 * * *"
    buildCommand: |
      npm ci
      npm run build
    startCommand: |
      node dist/worker/index.js
    envVars:
      - key: SUPABASE_URL
        sync: false                       # set in Render dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                       # set in Render dashboard — never commit
      # OOM root cause (confirmed 2026-06-11 logs): a single `npx -y <pkg>`
      # install pulls the server's full transitive npm tree — native binaries
      # (prebuild-install / node-gyp) + large deps (e.g. posthog-node) — and
      # extraction spikes RSS past 512Mi even at concurrency=1. The bomb is
      # often a TRANSITIVE dep, so a top-level build-script denylist misses it.
      #
      # Fix (2026-06-12): container memory watchdog (src/worker/memory-guard.ts)
      # polls the cgroup memory.current every 200ms; at MCP_VOUCH_MEM_LIMIT_MB
      # it aborts the running scan and SIGKILLs its npx→npm→node-gyp subtree,
      # marking the server skipped_oversized. The container never reaches the
      # 512Mi kernel ceiling. Stays free; if coverage of heavy packages matters
      # later, upgrade plan starter → standard 2Gi and raise the limit.
      # PRIMARY OOM fix: NPM_CONFIG_IGNORE_SCRIPTS is injected into the scanned
      # server's `npx -y` child env by TrustScanner (NOT set here — a global env
      # var would hit the worker's own `npm ci` build AND wouldn't reach the
      # child, since the MCP SDK spawns it with a sanitized env safelist). It
      # disables npm lifecycle scripts (prebuild-install / node-gyp) tree-wide,
      # killing the native-build memory spike at the source. Watchdog = backstop.
      - key: MCP_VOUCH_CONCURRENCY
        value: "1"                        # serial — killSubtree assumes 1 in-flight scan
      - key: NODE_OPTIONS
        value: "--max-old-space-size=256" # keep parent heap small so installs get max headroom
      - key: MCP_VOUCH_MEM_LIMIT_MB
        value: "360"                      # watchdog trip point; margin below 512Mi (tree-RSS undercounts)
      - key: MCP_VOUCH_MEM_POLL_MS
        value: "200"
      - key: MCP_VOUCH_SCAN_TIMEOUT_MS
        value: "60000"
      - key: MCP_VOUCH_MAX_PER_RUN
        value: "200"
      - key: NODE_VERSION
        value: "22.14.0"
